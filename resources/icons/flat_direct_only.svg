<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <g fill="none" stroke="#d1e4fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 階層: 親 → 子（1段だけ） -->
    <path d="M3 4.5h8"/>
    <path d="M5 9.5h6"/>
    <path d="M3 4.5v5"/>
    <!-- 下向き矢印が停止バーで止まる（それ以下へは降りない） -->
    <path d="M15.5 3.5v7.5"/>
    <path d="M12.8 8.3l2.7 2.7 2.7-2.7"/>
    <path d="M12 14h7"/>
    <!-- 孫階層は薄く（対象外） -->
    <path d="M7 14.5h4" stroke-opacity="0.3"/>
    <path d="M5 9.5v5" stroke-opacity="0.3"/>
  </g>
</svg>
